<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="RIDETOGETHER — Goa 2026. A road trip room for the crew." />
    <title>RIDETOGETHER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so day mode never flashes dark.
      (function () {
        try {
          var p = localStorage.getItem('rt.theme');
          var auto = p !== 'day' && p !== 'night';
          var h = new Date().getHours();
          var day = p === 'day' || (auto && h >= 6 && h < 18);
          var root = document.documentElement;
          if (day) root.classList.add('rt-theme-day');
          root.style.colorScheme = day ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', day ? '#f3f1ea' : '#0a0a0c');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
