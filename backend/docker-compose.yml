services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ridetogether-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ridetogether
      POSTGRES_PASSWORD: ridetogether
      POSTGRES_DB: ridetogether
    ports:
      - "5433:5432"
    volumes:
      - ridetogether_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridetogether -d ridetogether"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ridetogether-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ridetogether_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ridetogether_pgdata:
  ridetogether_redisdata: